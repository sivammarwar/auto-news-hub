<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Title & Description ───────────────────────────────────────────── -->
    <title>Signal — Latest News on Cricket, Bollywood, Tech & More</title>
    <meta name="description" content="Signal brings you the latest news on cricket, Bollywood, technology, business, India, world affairs, health and science — sharp, original and always on point." />

    <meta property="og:type"         content="website" />
    <meta property="og:site_name"    content="Signal" />
    <meta property="og:title"        content="Signal — Latest News on Cricket, Bollywood, Tech & More" />

    <meta name="twitter:card"        content="summary_large_image" />

    <!-- ── Theme color ────────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#ffffff" />
