name: Fetch Viral Articles

on:
  schedule:
    - cron: "0 8 * * *"   # 8:00 AM UTC daily
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger fetch-viral
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET https://auto-news-hub.vercel.app/api/cron/fetch-viral \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 3600)
          echo "Status: $RESPONSE"
          cat /tmp/response.json
          [ "$RESPONSE" = "200" ] || exit 1